name: Verify and publish demo

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Test
        run: dotnet test SocialWebDemo.slnx -c Release
      - name: Build API
        run: dotnet build src/SocialWebDemo.Api -c Release
      - name: Check generated snapshot
        run: |
          dotnet run --project src/SocialWebDemo.Api -c Release --no-launch-profile --no-build -- --export-snapshot
          git diff --exit-code -- site/data/snapshot.json
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
